name: Daily Job Agent

on:
  workflow_dispatch:

  schedule:
    # Runs every day at 20:30 UTC.
    # Italy time:
    # - 21:30 during winter
    # - 22:30 during summer
    #
    # I use minute 30 instead of 00 because GitHub says scheduled
    # workflows can be delayed or dropped during high-load times,
    # especially at the start of the hour.
    - cron: "30 20 * * *"

jobs:
  run-job-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run job agent
        run: |
          python main.py