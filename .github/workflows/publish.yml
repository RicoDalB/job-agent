# name: Nightly Job Agent Publish

on:
  workflow_dispatch:

  # schedule:
    # - cron: "0 21 * * *"
      # timezone: "Europe/Rome"

jobs:
  run-job-agent:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Google credentials file
        run: |
          echo "GOOGLE_CREDENTIALS_FILE=$RUNNER_TEMP/google_credentials.json" >> "$GITHUB_ENV"
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$RUNNER_TEMP/google_credentials.json"

      - name: Debug credentials metadata
        run: |
          python - <<'PY'
          import json
          import os

          print("GOOGLE_SHEET_ID exists:", bool(os.environ.get("GOOGLE_SHEET_ID")))
          print("GOOGLE_CREDENTIALS_FILE:", os.environ.get("GOOGLE_CREDENTIALS_FILE"))

          with open(os.environ["GOOGLE_CREDENTIALS_FILE"], "r") as f:
              info = json.load(f)

          print("Service account email:", info.get("client_email"))
          print("Project ID:", info.get("project_id"))
          PY

      - name: Run scraping and ranking pipeline
        run: |
          python main.py

      - name: Show generated data files
        run: |
          ls -lah data || true
          python - <<'PY'
          import os
          import pandas as pd

          path = "data/ranked_jobs.csv"

          if not os.path.exists(path):
              raise FileNotFoundError("data/ranked_jobs.csv was not created")

          df = pd.read_csv(path)
          print("ranked_jobs.csv rows:", len(df))
          print(df.head(3).to_string())
          PY

      - name: Upload ranked CSV to Google Sheets
        run: |
          python scripts/upload_ranked_csv_to_sheets.py

      - name: Upload generated CSV files as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-agent-data
          path: |
            data/*.csv
