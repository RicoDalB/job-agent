name: Nightly Job Agent Publish

on:
  workflow_dispatch:

  schedule:
    # Every night at 21:00 Europe/Rome time
    - cron: "0 21 * * *"
      timezone: "Europe/Rome"

jobs:
  run-job-agent:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GOOGLE_CREDENTIALS_FILE: ${{ runner.temp }}/google_credentials.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google credentials file
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$GOOGLE_CREDENTIALS_FILE"

      - name: Run scraping and ranking pipeline
        run: |
          python main.py

      - name: Upload ranked jobs to Google Sheets
        run: |
          python scripts/upload_ranked_csv_to_sheets.py

      - name: Upload generated CSV files as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-agent-data
          path: |
            data/*.csv